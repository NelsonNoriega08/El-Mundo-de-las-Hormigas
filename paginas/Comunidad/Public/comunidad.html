<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Colonia Ant-Geek — Comunidad</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path fill='%23E07A2A' d='M12 2C10 2 8.2 3 7 4.7 5.8 6.4 5.5 8.4 6.1 10.1 6.7 11.8 8.5 13 10 13v2c0 1 1 2 2 2s2-1 2-2v-2c1.5 0 3.3-1.2 3.9-2.9.6-1.7.3-3.7-1-5.4C15.8 3 14 2 12 2z'/></svg>" alt="hormiga"/>
        <h1>Colonia Ant-Geek</h1>
      </div>

      <div class="auth-area" id="auth-area">
        <!-- Login / Register forms -->
        <input id="login-user" placeholder="usuario" />
        <input id="login-pass" placeholder="contraseña" type="password" />
        <button id="btn-login">Entrar</button>
        <button id="btn-show-register">Registrarse</button>
      </div>
    </header>

    <main class="main">
      <nav class="sidebar">
        <button id="tab-chat" class="active">Chat</button>
        <button id="tab-foro">Foro</button>
        <button id="tab-admin" style="display:none">Moderación</button>
      </nav>

      <section class="content">
        <!-- CHAT -->
        <div id="panel-chat" class="panel">
          <div id="chat-window" class="chat-window"></div>

          <form id="chat-form" class="chat-form">
            <input id="chat-input" placeholder="Escribe un mensaje..." autocomplete="off" maxlength="500"/>
            <button type="submit">Enviar</button>
          </form>
        </div>

        <!-- FORO -->
        <div id="panel-foro" class="panel hidden">
          <form id="nuevo-tema-form" class="nuevo-tema" enctype="multipart/form-data">
            <input id="tema-titulo" placeholder="Título del tema" required maxlength="120"/>
            <input id="tema-autor" placeholder="Tu alias (opcional)" maxlength="30"/>
            <textarea id="tema-contenido" placeholder="Explica tu tema..." required maxlength="3000"></textarea>
            <label>Imagen (opcional) <input id="tema-image" type="file" accept="image/*" /></label>
            <button type="submit">Crear tema</button>
          </form>

          <div id="lista-temas" class="lista-temas"></div>
        </div>

        <!-- Moderación -->
        <div id="panel-admin" class="panel hidden">
          <h3>Panel de moderación</h3>
          <div id="mod-list"></div>
        </div>
      </section>
    </main>

    <footer class="foot">¡Comparte datos frikis sobre hormigas y respeta las normas!</footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="auth.js"></script>
  <script src="chat.js"></script>
  <script src="foro.js"></script>
</body>
</html>
